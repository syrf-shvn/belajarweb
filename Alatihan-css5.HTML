<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Text Styling CSS</title>
  <style>
    body {
      font-family: Georgia, serif;
      background-color: #fafafa;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-style: italic;
    }

    p {
      line-height: 1.5;
      t: justify;
    }

    .catatan {
      font-style: oblique;
      text-align: right;
    }
  </style>
</head>
<body>

  <h1>Quotes Of The Day</h1>
  <p>
   "The only way to achieve the impossible is to believe it is possible."
  </p>
  <p class="catatan">- Charles Kingsleigh (Alice in Wonderland)</p>

</body>
</html>
