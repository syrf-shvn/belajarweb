<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properti</title>
    <style>
        body { 
            background-color: antiquewhite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(184, 120, 120);
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
        }
        p {
            font-size: 16px;
            font-weight: lighter;
        }
        .marked {
            color: whitesmoke;
            background-color: #c7a07a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Mauu apaa yaaa</h1>
    <p>ini adalah paragraf biasa</p>
    <p class="marked">ini adalah paragraf yang ditandai</p>
</body>
</html>
